<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile</title>
    <script>
        function fetchData() {
            fetch(`api/v1/user/weee001001`)
                .then(response => response.json())  // Parse the JSON response
                .then(data => {
                    console.log(data);  // Log the data to the console for debugging
                    displayData(data);  // Call displayData function to update the HTML with fetched data
                })
                .catch(error => {
                    console.error("Error fetching data:", error);  // Handle any errors
                });
        }
        // Function to display data in the HTML
        function displayData(data) {
            document.getElementById("userName").innerText = data.name;
            document.getElementById("userEmail").innerText = data.email;
            document.getElementById("userStreet").innerText = data.address.street;
            document.getElementById("userCity").innerText = data.address.city;
            document.getElementById("userState").innerText = data.address.state;
            document.getElementById("userCountry").innerText = data.address.country;
            document.getElementById("userPostalCode").innerText = data.address.postalCode;
        }
    </script>
</head>
<body>

<h1>Welcome to the User Profile Page</h1>
<p>Account Number: <span th:text="${accountNumber}"></span></p>
<!-- You can also trigger fetchData manually with a button -->
<button onclick="fetchData()">Get API Data</button>
<!-- Display fetched data here -->
<p><strong>Name:</strong> <span id="userName"></span></p>
<p><strong>Email:</strong> <span id="userEmail"></span></p>
<h3>Address:</h3>
<p><strong>Street:</strong> <span id="userStreet"></span></p>
<p><strong>City:</strong> <span id="userCity"></span></p>
<p><strong>State:</strong> <span id="userState"></span></p>
<p><strong>Country:</strong> <span id="userCountry"></span></p>
<p><strong>Postal Code:</strong> <span id="userPostalCode"></span></p>

</body>
</html>
