openapi: 3.0.3
info:
  title: Banking API Specification for account operations
  description: |-
    A simple banking API that allows two operations:
    - API to open an account with the option to add initial credit.
    - API to retrieve account information including account balance.
    - API to retrieve person information.
    - API to make a transfer from one account to another.

  version: '1.0'
servers:
  - url: '{protocol}://localhost:8080/{basePath}'
    description: My API locally hosted Dev Server
security:
  - bearerAuth: [ ]

tags:
  - name: Account
    description: Operations between bank accounts
paths:
  /accounts/create-account:
    post:
      tags:
        - Account
      summary: Create an account
      description: Create an account with an option to deposit initial amount
      operationId: createAccount
      requestBody:
        description: User Details and Desired amount to deposit
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        200:
          description: Success.OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        404:
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotFoundError'
  /accounts/{accountNumber}/balance:
    get:
      security:
        - bearerAuth:
            - ROLE_USER
      tags:
        - Account
      summary: Get account balance
      description: Get account information using account number
      operationId: getBalance
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Account Balance updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountM'
        404:
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotFoundError'
  /accounts/deposit:
    post:
      tags:
        - Account
      summary: Deposit amount to account
      description: Initiates a deposit operation of a desired amount to the account specified
      operationId: depositToAccount
      requestBody:
        description: Account number and desired amount to deposit
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
        required: true
      responses:
        200:
          description: Person Information Retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountM'
        204:
          description: Success
        404:
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotFoundError'
  /accounts/transactions/{accountNumber}:
    get:
      security:
        - bearerAuth:
            - ROLE_USER
      tags:
        - Account
      summary: Shows the transactions specific to an account
      description: Shows the transactions specific to an account
      operationId: getTransactionsOfAnAccount
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
            example: "A3C0C6510"
      responses:
        200:
          description: Transaction details will be provided
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionM'
        404:
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotFoundError'
        401:
          description: Authorization information is missing or invalid.
        503:
          description: Unexpected error.

  /accounts/transactions/filtered:
    post:
      summary: Get filtered transactions
      description: Fetch a list of transactions filtered by account number, date range, and amount.
      operationId: getFilteredTransactions
      requestBody:
        description: Criteria for filtering the transactions
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountNumber:
                  type: string
                  example: "A3C0C6510"
                  description: The account number to filter by.
                startDate:
                  type: string
                  format: date
                  example: "2023-01-01"
                  description: The start date of the range to filter transactions.
                endDate:
                  type: string
                  format: date
                  example: "2023-12-31"
                  description: The end date of the range to filter transactions.
                minAmount:
                  type: number
                  example: 100
                  description: The minimum amount to filter transactions.
                maxAmount:
                  type: number
                  example: 1000
                  description: The maximum amount to filter transactions.
      responses:
        '200':
          description: A list of filtered transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionM'
        '400':
          description: Bad request (e.g., invalid parameters)
        '500':
          description: Internal server error
  /user/{accountNumber}:
    get:
      security:
        - bearerAuth:
            - ROLE_USER
      tags:
        - Account
      summary: Retrieves Person information
      description: Retrieves Person information using User id.
      operationId: UserId
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Person Information Retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        404:
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotFoundError'
        401:
          description: Authorization information is missing or invalid.
        503:
          description: Unexpected error.
  /user/users:
    get:
      security:
        - bearerAuth:
            - ROLE_USER
      tags:
        - User
      summary: Retrieves Person information
      description: Retrieves Person information using User id.
      operationId: getAllUsers
      responses:
        200:
          description: Person Information Retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        404:
          description: Account not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountNotFoundError'
        401:
          description: Authorization information is missing or invalid.
        503:
          description: Unexpected error.
  /accounts/delete/{accountNumber}:
    get:
      security:
        - bearerAuth:
            - ROLE_USER
      tags:
        - Account
      summary: Retrieves Person information
      description: Retrieves Person information using User id.
      operationId: deleteUserByAccountNumber
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: number
        404:
          description: Account not found
          content:

        401:
          description: Authorization information is missing or invalid.
        503:
          description: Unexpected error.
  /accounts:
    get:
      security:
        - bearerAuth:
            - ROLE_USER
      tags:
        - Account
      summary: Retrieves All Accounts
      description: Retrieves All Accounts
      operationId: getAllAccounts
      responses:
        200:
          description: Account fetched successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountM'
        404:
          description: Account not exists
          content:
        401:
          description: Authorization information is missing or invalid.
        503:
          description: Unexpected error.
  /transfer:
    post:
      tags:
        - Account
      summary: Makes money transfer between Accounts
      description: Makes transfer between Accounts
      operationId: transferId
      requestBody:
        description: Sender Account , Receiver account and Amount to be transferred need to be provided
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        200:
          description: Transaction details will be provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionM'
        404:
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotFoundError'
        401:
          description: Authorization information is missing or invalid.
        503:
          description: Unexpected error.

# 1) Define the security scheme type (HTTP bearer)
components:
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NewAccount:
      type: object
      required:
        - name
        - email
        - password
        - street
        - city
        - state
        - country
        - postalCode
      properties:
        User:
          $ref: '#/components/schemas/UserM'
    AddressM:
      type: object
      properties:
        street:
          type: string
          example: 'street name'
        city:
          type: string
          example: 'city name'
        state:
          type: string
          example: 'state name'
        country:
          type: string
          example: 'country name'
        postalCode:
          type: string
          pattern: '^\d{6}$'
          example: '501510'
    UserM:
      type: object
      properties:
        name:
          type: string
          example: 'fullName'
        email:
          type: string
          format: email
          example: 'maxmuller@gmail.com'
        password:
          type: string
          example: "max234"
        roles:
          type: string
        address:
          $ref: '#/components/schemas/AddressM'
        account:
          $ref: '#/components/schemas/AccountM'
    UserInfo:
      type: object
      properties:
        name:
          type: string
          example: 'Full Name'
        email:
          type: string
          format: email
          example: 'maxmuller@gmail.com'
        address:
          $ref: '#/components/schemas/AddressM'
    UserCreated:
      type: object
      properties:
        accountNumber:
          type: string
          example: 'A1234'
        balance:
          type: number
          example: 5000.00
          minimum: 0
        status:
          type: string
        createdTimeStamp:
          type: string
          format: date-time # or date-time
        UpdatedTimeStamp:
          type: string
          format: date-time # or date-time
    AccountM:
      type: object
      properties:
        accountNumber:
          type: string
          readOnly: true
          example: 'A1234'
        balance:
          type: number
          example: 5000.00
        status:
          type: string
        createdTimeStamp:
          type: string
          format: date-time # or date-time
        UpdatedTimeStamp:
          type: string
          format: date-time # or date-time
    AccountNotFoundError:
      type: object
      properties:
        message:
          type: string
    TransferRequest:
      type: object
      required:
        - senderAccount
        - receiverAccount
        - amount
      properties:
        senderAccount:
          type: string
        receiverAccount:
          type: string
        amount:
          type: number
    TransactionM:
      type: object
      properties:
        id:
          type: number
          format: int64
        amount:
          type: number
        userId:
          type: number
        senderAccount:
          type: string
        receiverAccount:
          type: string
        createdTimeStamp:
          type: string
          format: date-time
        UpdatedTimeStamp:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        lastUpdatedBy:
          type: string
        randomUUId:
          type: string
        transactionId:
          type: string
        transactionBy:
          type: string
    DepositRequest:
      type: object
      properties:
        accountNumber:
          type: string
        amount:
          type: number






